# Hermes E2E test harness — fails CI when the PR adds a file named
# HERMES_E2E_FAIL.flag at the repo root. The agent only adds this file
# when the Hermes E2E suite explicitly asks for it, so normal PRs see
# the no-op job.
#
# Why a marker file (not a branch prefix)? The Hermes runner hardcodes
# branch names to `hermes/<short-session-id>`; we cannot ask it to use
# a specific suffix. A marker file in the PR is a clean opt-in.

name: hermes-e2e-fake-ci

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  always-fails-when-marker-present:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for E2E failure marker
        run: |
          if [ -f HERMES_E2E_FAIL.flag ]; then
            echo "::error::Synthetic failure for Hermes auto-amend E2E (HERMES_E2E_FAIL.flag present)."
            exit 1
          else
            echo "no marker file — skipping synthetic failure"
          fi
