# Hermes E2E test harness — emits a deterministic check_run failure on
# any PR whose branch starts with `hermes/e2e-fail`. Skips all other
# branches so it does not interfere with real CI.
#
# This is intentionally crude: a real CI surfaces an error message that
# the agent then parses + fixes. For E2E we only care that
# check_run.completed with conclusion=failure is delivered to the
# control plane's webhook.

name: hermes-e2e-fake-ci

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  always-fails-on-hermes-e2e-fail-branches:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'hermes/e2e-fail')
    steps:
      - name: Intentional failure for Hermes E2E
        run: |
          echo "::error::Synthetic failure for Hermes auto-amend E2E (branch=${{ github.head_ref }})."
          exit 1

  noop-on-other-branches:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'hermes/e2e-fail') }}
    steps:
      - run: echo "skipped — not a hermes-e2e-fail branch"
